[project]
name = "viasegura-ai"
version = "0.1.0"
description = "Priorización espacial de siniestralidad vial en Bogotá"
requires-python = ">=3.11"
dependencies = [
    # Datos
    "pandas>=2.0",
    "numpy>=2.0",
    "geopandas>=1.0",
    "shapely>=2.0",
    "pyproj>=3.6",
    # Visualización
    "matplotlib>=3.8",
    "folium>=0.18",
    "branca>=0.8",
    "seaborn>=0.13",
    # Red y APIs
    "requests>=2.31",
    "websocket-client>=1.8",
    # Anthropic SDK (agentes)
    "anthropic>=0.30",
    # Jupyter / notebooks
    "jupyterlab>=4.0",
    "ipykernel>=6.29",
    "nbformat>=5.9",
    "nbclient>=0.10",
    "ipywidgets>=8.0",
    # ML (para NB05+)
    "scikit-learn>=1.4",
    "scipy>=1.12",
    # Utilidades
    "tqdm>=4.66",
    "openpyxl>=3.1",
    "python-dotenv>=1.0",
    "osmnx>=2.1.0",
    "networkx>=3.6.1",
    "contextily>=1.7.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4",
    "pytest>=8.0",
]

[dependency-groups]
dev = [
    "ruff>=0.4",
    "pytest>=8.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

